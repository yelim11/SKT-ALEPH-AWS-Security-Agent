name: stage22-clean-reproduction

on:
  push:
    branches:
      - stage22-repro-check

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact submitted source
        uses: actions/checkout@v4
        with:
          ref: a509c06619560e0bfa155758605764e07f8bb911
          fetch-depth: 1

      - name: Use class Node version
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Verify source identity and syntax
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne "a509c06619560e0bfa155758605764e07f8bb911") {
            throw "HEAD mismatch: $head"
          }
          if ((git status --porcelain).Length -ne 0) {
            throw "Checkout is not clean before run."
          }
          $node = (node --version).Trim()
          Write-Host "NODE_VERSION=$node"
          if ($node -ne "v24.19.0") {
            throw "Node version mismatch: $node"
          }
          npm run check

      - name: First launch and browser-equivalent HTTP check
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $output = & powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\start-alekov.ps1 -Background 2>&1
          $output | ForEach-Object { Write-Host $_ }
          $joined = ($output -join "`n")
          if ($joined -notmatch "케셰브가 켜졌습니다") { throw "Start signal missing." }
          if ($joined -notmatch "서버가 응답한 것만 확인했습니다") { throw "Server-only boundary signal missing." }

          $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:5189/" -TimeoutSec 10
          Write-Host "FIRST_HTTP_STATUS=$($response.StatusCode)"
          if ($response.StatusCode -ne 200) { throw "Unexpected first HTTP status." }
          foreach ($text in @("보호 현황","업무 앱","보안 기록","학생 구현 표시","설치 패키지와 취약점 정보")) {
            if ($response.Content -notmatch [regex]::Escape($text)) {
              throw "Expected UI text missing: $text"
            }
          }

      - name: Stop first launch
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $conn = Get-NetTCPConnection -LocalAddress 127.0.0.1 -LocalPort 5189 -State Listen -ErrorAction Stop | Select-Object -First 1
          Write-Host "FIRST_SERVER_PID=$($conn.OwningProcess)"
          Stop-Process -Id $conn.OwningProcess -Force
          Start-Sleep -Seconds 1
          if (Get-NetTCPConnection -LocalAddress 127.0.0.1 -LocalPort 5189 -State Listen -ErrorAction SilentlyContinue) {
            throw "Port 5189 is still listening after stop."
          }

      - name: Relaunch and verify clean checkout remains unchanged
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $output = & powershell -NoProfile -ExecutionPolicy Bypass -File .\tools\start-alekov.ps1 -Background 2>&1
          $output | ForEach-Object { Write-Host $_ }
          $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:5189/" -TimeoutSec 10
          Write-Host "SECOND_HTTP_STATUS=$($response.StatusCode)"
          if ($response.StatusCode -ne 200) { throw "Unexpected second HTTP status." }

          $conn = Get-NetTCPConnection -LocalAddress 127.0.0.1 -LocalPort 5189 -State Listen -ErrorAction Stop | Select-Object -First 1
          Write-Host "SECOND_SERVER_PID=$($conn.OwningProcess)"
          Stop-Process -Id $conn.OwningProcess -Force
          Start-Sleep -Seconds 1

          $dirty = git status --porcelain
          if ($dirty) {
            Write-Host $dirty
            throw "Runtime changed tracked or untracked repository files."
          }
          Write-Host "REPRODUCTION_RESULT=PASS"
